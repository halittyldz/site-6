<body>

    <!-- 1. HEADER SECTION -->
    <div id="header-placeholder"></div>

    <main class="product-container">
        
        <!-- Breadcrumb -->
        <div class="breadcrumb">
            <a href="new.html"><i class="fa-solid fa-house"></i> Home</a> &nbsp;&gt;&nbsp; <span>Mercedes-Benz Actros Pro Cabin Sunvisor Type 1</span>
        </div>

        <div class="product-grid">
            
            <!-- Left: Image Gallery -->
            <div class="product-gallery">
                <img src="23042026133256.webp" alt="Actros Sunvisor" class="main-image" id="mainProductImage">
                
                <div class="thumbnails">
                    <img src="23042026133256.webp" class="active">
                    <img src="truck-tractor---1790766298331094649_big--26093014044566548600.jpg">
                    <img src="truck-tractor-DAF-CF480-EURO-6-SPACE-CAB-6X2-TRACTOR-UNIT-2020-YN70-YZV---1790950881941410958_big--26100217211986142400.jpg">
                    <img src="asdasdasad.webp">
                </div>
            </div>

            <!-- Right: Product Info -->
            <div class="product-info">
                <h1 class="product-title">Daf XF 106 EURO6</h1>
                
                <p class="product-desc">
                    OEM:1651597 
                </p>
            </div>
        </div>        
                
    </main>


    <!-- 3. FOOTER SECTION -->
    <!-- 3. FOOTER SECTION -->
    <div id="footer-placeholder"></div>

    <!-- Interactive Scripts -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            
            // 1. Load Header & Activate Header Scripts
            fetch('header.html') 
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                
                // Hamburger & Mobile Panel Logic
                const hamburger = document.getElementById("hamburger-menu");
                const mobileMenu = document.getElementById("mobile-menu-panel");
                
                if (hamburger && mobileMenu) {
                    hamburger.addEventListener("click", function() {
                        hamburger.classList.toggle("active");
                        mobileMenu.classList.toggle("open");
                    });
                }

                // Nested Models Sub-Accordion Logic
                const subAccordionBtns = document.querySelectorAll('.sub-accordion-btn');
                subAccordionBtns.forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        const menu = this.nextElementSibling;
                        menu.classList.toggle('open');
                        const arrow = this.querySelector('.sub-arrow');
                        if (arrow) {
                            arrow.innerHTML = menu.classList.contains('open') ? "↑" : "↓";
                        }
                    });
                });
                
                // Desktop Dropdown Logic
                const dropdownBtn = document.getElementById("brandsDropdownBtn");
                const dropdownMenu = document.getElementById("brandsDropdownMenu");
                const dropdownIcon = document.getElementById("dropdownIcon");

                if(dropdownBtn) {
                    dropdownBtn.addEventListener("click", function(event) {
                        event.stopPropagation(); 
                        dropdownMenu.classList.toggle("show");
                        dropdownBtn.classList.toggle("active");
                        dropdownIcon.innerHTML = dropdownBtn.classList.contains("active") ? "↑" : "↓";
                    });

                    document.addEventListener("click", function(event) {
                        if (!dropdownBtn.contains(event.target) && !dropdownMenu.contains(event.target)) {
                            dropdownMenu.classList.remove("show");
                            dropdownBtn.classList.remove("active");
                            dropdownIcon.innerHTML = "↓";
                        }
                    });
                }

                // Header Scroll Color Logic
                const headerElement = document.getElementById("siteHeader");
                if (headerElement) {
                    window.addEventListener("scroll", function() {
                        if (window.scrollY > 50) {
                            headerElement.classList.add("scrolled");
                        } else {
                            headerElement.classList.remove("scrolled");
                        }
                    });
                }
            });

            // 2. Load Footer
            fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            });

            // 3. PRODUCT IMAGE GALLERY LOGIC (NEW)
            const mainImage = document.getElementById('mainProductImage');
            const thumbnails = document.querySelectorAll('.thumbnails img');

            if (mainImage && thumbnails.length > 0) {
                thumbnails.forEach(thumbnail => {
                    thumbnail.addEventListener('click', function() {
                        // Update the main image source to match the clicked thumbnail
                        mainImage.src = this.src;
                        
                        // Remove 'active' class from all thumbnails
                        thumbnails.forEach(thumb => thumb.classList.remove('active'));
                        
                        // Add 'active' class to the clicked thumbnail
                        this.classList.add('active');
                    });
                });
            }

            // 4. Endless Carousel Nav Logic (Homepage Specific - Kept intact)
            const track = document.getElementById("brandsTrack");
            const btnLeft = document.getElementById("btnLeft");
            const btnRight = document.getElementById("btnRight");
            let isAnimating = false;

            if (btnLeft && btnRight && track) {
                btnRight.addEventListener("click", function() {
                    if (isAnimating) return;
                    isAnimating = true;
                    
                    const firstCard = track.firstElementChild;
                    const cardWidth = firstCard.offsetWidth;
                    const gap = 15; 
                    const scrollDistance = cardWidth + gap;

                    track.style.transition = "transform 0.4s ease-in-out";
                    track.style.transform = `translateX(-${scrollDistance}px)`;

                    const transitionEndHandler = function() {
                        track.style.transition = "none";
                        track.style.transform = "translateX(0)";
                        track.appendChild(track.firstElementChild); 
                        track.removeEventListener("transitionend", transitionEndHandler);
                        isAnimating = false;
                    };
                    track.addEventListener("transitionend", transitionEndHandler);
                });

                btnLeft.addEventListener("click", function() {
                    if (isAnimating) return;
                    isAnimating = true;

                    const lastCard = track.lastElementChild;
                    const cardWidth = lastCard.offsetWidth;
                    const gap = 15;
                    const scrollDistance = cardWidth + gap;

                    track.style.transition = "none";
                    track.prepend(track.lastElementChild);
                    track.style.transform = `translateX(-${scrollDistance}px)`;

                    void track.offsetWidth;

                    track.style.transition = "transform 0.4s ease-in-out";
                    track.style.transform = "translateX(0)";

                    const transitionEndHandler = function() {
                        track.style.transition = "none";
                        track.removeEventListener("transitionend", transitionEndHandler);
                        isAnimating = false;
                    };
                    track.addEventListener("transitionend", transitionEndHandler);
                });
            }
        });
    </script>
</body>
